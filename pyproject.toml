[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iccd-sim-ml"
version = "0.1.0"
description = "Axisymmetric plasma-to-ICCD simulation and ML models for laser-ablation plumes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
io = ["h5py>=3.9"]
viz = ["matplotlib>=3.7"]
ml = [
  "torch>=2.1",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
]

[project.scripts]
iccd-sim = "iccd_sim_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
